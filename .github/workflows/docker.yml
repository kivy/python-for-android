name: Docker

on:
  workflow_dispatch:
  push:
    branches:
      - develop
    tags:
      - "*"
  pull_request:

jobs:
  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Use classic Docker storage
        run: |
          echo '{"features":{"containerd-snapshotter":false}}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
          docker info --format 'Storage driver: {{ .Driver }}; Docker root: {{ .DockerRootDir }}'
          test "$(docker info --format '{{ .Driver }}')" = overlay2
      - uses: docker/setup-buildx-action@v4
      - run: make docker/build
      - name: docker login
        if: github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/tags/')
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: make docker/login
      - name: docker push
        if: github.ref == 'refs/heads/develop'
        run: make docker/push
      - name: docker push (tag)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          make docker/tag DOCKER_TAG=${GITHUB_REF#refs/tags/}
          make docker/push
